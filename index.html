<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Notes</title>
<style>
:root{--bg:#faf8f4;--text:#25221e;--muted:#6b645b;--card:#fff;--line:#e4ded3;--accent:#c2571a}
@media (prefers-color-scheme:dark){:root{--bg:#16140f;--text:#efe9de;--muted:#a89f90;--card:#1f1c16;--line:#383226;--accent:#f08a4b}}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.7;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 16px}
h1{margin:0 0 6px}p.sub{color:var(--muted);margin:0 0 28px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
.t{font-weight:700}.m{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Shared Notes</h1>
  <p class="sub">影片與閱讀心得整理</p>
  <h3 style="color:var(--muted);font-size:14px">Growth mindset</h3>
  <a class="card" href="growth-mindset/friends/">
    <div class="t">出社會後如何找到真正的朋友</div>
    <div class="m">薑餅資 · 人際關係與成長思維筆記 · 2026-10-23</div>
  </a>
  <a class="card" href="growth-mindset/obsidian/">
    <div class="t">零基礎20分鐘學會Obsidian 95%功能！</div>
    <div class="m">李廠長 · 工具教學與知識管理筆記 · 2026-08-08</div>
  </a>
</main>
</body>
</html>
